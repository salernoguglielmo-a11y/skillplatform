ottom:22px;background:#2e2e2e;color:white;border-radius:14px;padding:12px 16px;box-shadow:0 12px 35px #0002;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:relative;height:auto}.nav{display:grid;grid-template-columns:repeat(2,1fr)}.main{max-height:none}.grid-4,.grid-3,.grid-2,.split,.split-even{grid-template-columns:1fr}.workflow{grid-template-columns:1fr}.search input{width:100%}}

    const row=(cols,attrs='')=>`<tr ${attrs}>${cols.map(c=>`<td>${c}</td>`).join('')}</tr>`;
    const table=(heads,rows)=>`<table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${heads.length}">${empty('Nessun risultato')}</td></tr>`}</tbody></table>`;
    function dashboard(){return page('Dashboard','Panoramica operativa Skill Donor SIAVS')+`<div class="grid grid-4" style="margin-bottom:24px">${kpi('11','ETS attive','🤝',C.orange,'+2 questo mese')}${kpi('6','Aziende partner','🏢',C.blue,'+1 in negoziazione')}${kpi('7','Donors attivi','👥',C.green,'38 disponibili')}${kpi('9','Progetti attivi','💼',C.purple,'3 in matching')}</div><div class="split" style="margin-bottom:20px">${card('Ore donate per mese','2026 — ore caricate e validate',`<div class="bar-chart">${monthlyData.map(d=>`<div class="bar-wrap"><div class="bar" title="${d.ore} ore" style="--h:${d.ore*3}"></div>${d.m}</div>`).join('')}</div>`)}${card('Skill erogate','Distribuzione per area',`<div style="padding:20px 22px;display:flex;flex-direction:column;align-items:center"><div class="donut"></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:12px">${areaData.map(d=>`<span class="tiny muted"><span style="background:${d.color};width:8px;height:8px;border-radius:99px;display:inline-block"></span> ${d.name}</span>`).join('')}</div></div>`)}</div><div class="split-even">${card('Ultimi progetti','Stato corrente',ProgettiList.slice(0,5).map(p=>`<div class="list-row"><div style="min-width:0"><div class="strong small" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.title)}</div><div class="tiny muted">${esc(p.ets)}</div></div>${badge(p.status)}</div>`).join(''))}${card('Impatto cumulato 2026','Valore stimato ore donate',`<div class="grid grid-2" style="padding:18px 22px">${[['146','Ore totali caricate'],['118','Ore validate'],['€9.440','Valore stimato (€80/h)'],['89%','Tasso validazione']].map(x=>`<div class="stat-box"><div class="kpi-value">${x[0]}</div><div class="tiny muted">${x[1]}</div></div>`).join('')}</div>`)}</div>`;}
    function etsView(){if(state.selected){const e=ETSList.find(x=>x.id===state.selected); const ps=ProgettiList.filter(p=>p.ets.toLowerCase().includes(e.name.split(' ')[0].toLowerCase())||e.name.toLowerCase().includes(p.ets.split(' ')[0].toLowerCase())); return `<button class="btn" data-back>← Torna alla lista</button><br><br>`+page(e.name,`${e.city} · ${e.area}`,badge(e.status))+`<div class="split"><div class="grid">${card('Informazioni contatto','',`<div class="grid grid-2" style="padding:16px 22px">${[['Referente',e.contact],['Email',e.email],['Telefono',e.phone],['Attivo dal',e.since]].map(([l,v])=>`<div class="stat-box"><div class="stat-label">${l}</div><div class="strong small">${esc(v)}</div></div>`).join('')}</div>`)}${card('Progetti associati',`${ps.length} progetto/i`,ps.length?ps.map(p=>`<div class="list-row"><div><div class="strong small">${esc(p.title)}</div><div class="tiny muted">${esc(p.period)}</div></div>${badge(p.status)}</div>`).join(''):empty('Nessun progetto'))}</div>${card('Metriche ETS','',`<div style="padding:16px 22px">${[['Progetti attivati',e.projects],['Ore donate (stima)','32'],['Valore stimato','€2.560'],['Donor coinvolti','2']].map(([l,v])=>`<div class="list-row" style="background:var(--cream);border:0;border-radius:12px;margin-bottom:10px"><span class="small muted">${l}</span><b>${v}</b></div>`).join('')}</div>`)}</div>`;} const f=ETSList.filter(e=>(e.name+e.city).toLowerCase().includes(state.search.toLowerCase())); return page('ETS','Enti del Terzo Settore beneficiari',search('Cerca ETS...')+btn('＋ Aggiungi ETS','primary','data-action="Funzione di inserimento pronta per collegamento backend"'))+`<section class="card">${table(['Nome ETS','Sede','Area','Progetti','Stato','Referente',''],f.map(e=>row([`<div class="strong">${esc(e.name)}</div><div class="tiny muted">Dal ${e.since}</div>`,`📍 ${esc(e.city)}`,esc(e.area),`<span class="badge" style="background:var(--orange-light);color:var(--orange)">${e.projects}</span>`,badge(e.status),esc(e.contact),'›'],`class="clickable" data-ets="${e.id}"`)).join(''))}</section>`;}
    function aziende(){const f=AziendeList.filter(a=>a.name.toLowerCase().includes(state.search.toLowerCase())); return page('Aziende','Partner corporate e programmi di corporate volunteering',search('Cerca azienda...')+btn('＋ Aggiungi azienda','primary','data-action="Funzione di inserimento pronta per collegamento backend"'))+`<div class="grid grid-3" style="margin-bottom:24px">${kpi('5','Aziende attive','🏢',C.blue)}${kpi('38','Donors totali','👥',C.orange)}${kpi('1.618','Ore totali','⏱️',C.green)}</div><section class="card">${table(['Azienda','Settore','Programma','Donors','Ore donate','Stato','Referente'],f.map(a=>row([`<b>${esc(a.name)}</b>`,`<span class="pill">${esc(a.sector)}</span>`,esc(a.program),`<b>${a.donors}</b>`,`<b style="color:var(--orange)">${a.hours} h</b>`,badge(a.status),`<div>${esc(a.contact)}</div><div class="tiny muted">${esc(a.email)}</div>`])).join(''))}</section>`;}
    function donors(){if(state.selected){const d=DonorsList.find(x=>x.id===state.selected); return `<button class="btn" data-back>← Torna alla lista</button><br><br>`+page(d.name,`${d.role} · ${d.company}`,badge(d.status))+`<div class="split"><div class="grid">${card('Profilo professionale','',`<div class="grid grid-2" style="padding:16px 22px">${[['Ruolo',d.role],['Azienda',d.company],['Disponibilità',d.availability],['Modalità',d.mode]].map(([l,v])=>`<div class="stat-box"><div class="stat-label">${l}</div><div class="strong small">${esc(v)}</div></div>`).join('')}</div><div style="padding:0 22px 18px"><div class="stat-label">Skill certificate</div>${d.skills.map(sk=>`<span class="badge" style="background:var(--orange-light);color:var(--orange);margin:3px">${esc(sk)}</span>`).join('')}</div>`)}${card('Attività recente','',OreList.filter(o=>o.donor===d.name).map(o=>`<div class="list-row"><div><div class="strong small">${esc(o.progetto)}</div><div class="tiny muted">${esc(o.ets)} · ${o.data} · ${o.ore}h</div></div>${badge(o.status)}</div>`).join('')||empty('Nessuna attività recente'))}</div>${card('Statistiche','',`<div style="padding:16px 22px">${[['Progetti completati',d.projects],['Ore donate totali',d.hoursTotal+' h'],['Valore stimato','€'+(d.hoursTotal*80)],['Rating medio','⭐ '+d.rating]].map(([l,v])=>`<div class="list-row" style="background:var(--cream);border:0;border-radius:12px;margin-bottom:10px"><span class="small muted">${l}</span><b>${v}</b></div>`).join('')}</div>`)}</div>`;} const f=DonorsList.filter(d=>(d.name+d.role).toLowerCase().includes(state.search.toLowerCase())); return page('Donors / Dipendenti','Professionisti donatori di competenze',search('Cerca donor...')+btn('＋ Aggiungi Donor','primary','data-action="Funzione di inserimento pronta per collegamento backend"'))+`<div class="grid grid-2">${f.map(d=>`<div class="donor-card" data-donor="${d.id}"><div style="display:flex;justify-content:space-between;gap:12px"><div><div class="avatar" style="width:36px;height:36px;margin-bottom:8px">${d.name.split(' ').map(n=>n[0]).join('').slice(0,2)}</div><div class="strong">${esc(d.name)}</div><div class="small muted">${esc(d.role)} · ${esc(d.company)}</div></div><div style="text-align:right">${badge(d.status)}<div class="small muted" style="margin-top:6px">⭐ ${d.rating}</div></div></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin:12px 0">${d.skills.map(sk=>`<span class="pill">${esc(sk)}</span>`).join('')}</div><div class="small muted">🕐 ${d.availability} &nbsp; 📍 ${d.mode} &nbsp; 📁 ${d.projects} progetti &nbsp; ⏱ ${d.hoursTotal} h</div></div>`).join('')}</div>`;}
    function progetti(){if(state.selected){const p=ProgettiList.find(x=>x.id===state.selected); const steps=['Richiesta','Valutazione','Matching','Esecuzione','Report']; const idx={'Richiesta ETS':0,'In valutazione':1,Matching:2,'In corso':3,'Da validare':4,Chiuso:4}[p.status]??0; return `<button class="btn" data-back>← Torna ai progetti</button><br><br>`+page(p.title,`${p.ets} · ${p.azienda}`,badge(p.status))+`<div class="split"><div class="grid">${card('Dettagli progetto','',`<div class="grid grid-2" style="padding:16px 22px">${[['ETS beneficiario',p.ets],['Azienda / programma',p.azienda],['Area prevalente',p.area],['Modalità','Remoto / call'],['Periodo',p.period||'Da definire'],['Donor assegnato',p.donor||'In matching']].map(([l,v])=>`<div class="stat-box"><div class="stat-label">${l}</div><div class="strong small">${esc(v)}</div></div>`).join('')}</div>`)}${card('Workflow operativo','',`<div style="padding:16px 22px"><div class="workflow">${steps.map((s,i)=>`<div class="step ${i<=idx?'done':''}"><div class="step-num">${i+1}</div><div class="tiny ${i===idx?'strong':''}">${s}</div></div>`).join('')}</div></div>`)}${card('Log ore progetto','',OreList.filter(o=>p.title.toLowerCase().includes(o.progetto.split(' ')[0].toLowerCase())).map(o=>`<div class="list-row"><div><div class="strong small">${esc(o.donor)}</div><div class="tiny muted">${o.data} · ${o.ore}h · ${esc(o.note)}</div></div>${badge(o.status)}</div>`).join('')||empty('Nessuna ora registrata'))}</div><div class="grid">${p.match?card('Match Donor','',`<div style="padding:16px 22px;text-align:center"><div style="font-size:44px;font-weight:900;color:var(--orange)">${p.match}%</div><div class="small muted" style="margin-bottom:16px">Compatibilità con ${esc(p.donor)}</div>${btn('✓ Conferma matching','primary','data-action="Matching confermato" style="width:100%;justify-content:center"')}</div>`):''}${card('Azioni rapide','',`<div class="grid" style="padding:14px 18px">${btn('✎ Modifica progetto','','data-action="Modifica progetto pronta"')}${btn('⏱ Aggiungi ore','','data-action="Inserimento ore pronto"')}${btn('⬇ Esporta report','','data-action="Export report pronto"')}${btn('🗑 Chiudi progetto','danger','data-action="Chiusura progetto pronta"')}</div>`)}</div></div>`;} const statuses=['Tutti','Richiesta ETS','In valutazione','Matching','In corso','Da validare','Chiuso']; const f=ProgettiList.filter(p=>(state.filter==='Tutti'||p.status===state.filter)&&(p.title+p.ets).toLowerCase().includes(state.search.toLowerCase())); return page('Progetti','Gestione ciclo di vita dei progetti di skill volunteering',search('Cerca progetto...')+btn('＋ Nuovo progetto','primary','data-action="Creazione progetto pronta"'))+tabs(statuses,state.filter,'filter')+`<section class="card">${table(['Progetto','ETS','Azienda','Area','Periodo','Stato','Donor',''],f.map(p=>row([`<b>${esc(p.title)}</b>`,esc(p.ets),esc(p.azienda),`<span class="pill">${esc(p.area)}</span>`,`<span class="muted">${esc(p.period)}</span>`,badge(p.status),`${esc(p.donor)} ${p.match?`<b style="color:var(--orange);font-size:11px">${p.match}%</b>`:''}`,'›'],`class="clickable" data-project="${p.id}"`)).join(''))}</section>`;}
    function matching(){const open=ProgettiList.filter(p=>['In valutazione','Richiesta ETS','Matching'].includes(p.status)); const sel=open.find(p=>p.id===state.matchingProject); return page('Motore di matching','Abbinamento automatico donor–progetto basato su skill, disponibilità e preferenze')+`<div class="split-even">${card('Progetti in attesa di matching',`${open.length} da abbinare`,open.map(p=>`<div class="list-row clickable" data-match-project="${p.id}" style="background:${sel?.id===p.id?'var(--orange-light)':'transparent'}"><div><div class="strong small">${esc(p.title)}</div><div class="tiny muted">${esc(p.ets)}</div><div style="margin-top:6px"><span class="pill">${esc(p.area)}</span></div></div>${badge(p.status)}</div>`).join(''))}${card('Risultati matching',sel?`Per: ${sel.title.slice(0,40)}...`:'Seleziona un progetto',!sel?empty('← Seleziona un progetto per avviare il matching'):!state.matchStarted?`<div style="padding:20px 22px;text-align:center"><div style="font-size:32px">✨</div><div class="strong">Progetto selezionato</div><div class="small muted" style="margin-bottom:20px">Clicca “Avvia matching” per trovare i donor più compatibili</div>${btn('✨ Avvia matching','primary','data-start-match')}</div>`:DonorsList.filter(d=>d.status==='Attivo').sort((a,b)=>b.rating-a.rating).slice(0,4).map((d,i)=>`<div class="list-row" style="align-items:flex-start"><div><div class="strong small">${esc(d.name)}</div><div class="tiny muted">${esc(d.role)} · ${esc(d.company)}</div><div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px">${d.skills.slice(0,3).map(sk=>`<span class="pill">${esc(sk)}</span>`).join('')}</div><div style="margin-top:10px">${btn('✓ Proponi','primary','data-action="Proposta inviata"')}${btn('👁 Profilo','','data-action="Apertura profilo pronta"')}</div></div><div style="text-align:right"><div style="font-size:20px;font-weight:900;color:${i<2?'var(--orange)':'var(--amber)'}">${[94,87,81,72][i]}%</div><div class="tiny muted">match</div></div></div>`).join(''))}</div>`;}
    function ore(){const statuses=['Tutte','Da validare','In attesa ETS','Validata']; const f=state.filter==='Tutte'?OreList:OreList.filter(o=>o.status===state.filter); return page('Ore e validazioni','Rendicontazione ore donate — validabili solo dopo approvazione ETS/SIAVS',btn('＋ Carica ore','primary','data-action="Caricamento ore pronto"'))+`<div class="grid grid-4" style="margin-bottom:22px">${kpi('146','Ore caricate','⏱️',C.blue)}${kpi('118','Validate','✅',C.green)}${kpi('14','Da validare','⚠️',C.amber)}${kpi('14','Rifiutate/Attesa','❌',C.red)}</div>${tabs(statuses,state.filter,'filter')}<section class="card">${table(['Donor','Progetto','ETS','Data','Ore','Note','Stato','Azioni'],f.map(o=>row([`<b>${esc(o.donor)}</b>`,esc(o.progetto),esc(o.ets),`<span class="muted">${o.data}</span>`,`<span class="badge" style="background:var(--orange-light);color:var(--orange)">${o.ore}h</span>`,`<span class="muted">${esc(o.note)}</span>`,badge(o.status),['Da validare','In attesa ETS'].includes(o.status)?`${btn('✓ Valida','','data-validate="'+o.id+'"')}${btn('✕ Rifiuta','danger','data-reject="'+o.id+'"')}`:'<span class="muted">—</span>'])).join(''))}</section>`;}
    function report(){return page('Report impatto','Misurazione e rendicontazione del valore sociale generato',btn('⬇ Esporta PDF','primary','data-action="Export PDF pronto"'))+`<div class="grid grid-4" style="margin-bottom:22px">${kpi('€9.440','Valore stimato','📈',C.orange)}${kpi('118','Ore validate','⏱️',C.green)}${kpi('9','ETS supportate','🤝',C.blue)}${kpi('7','Donors attivi','👥',C.purple)}</div><div class="split" style="margin-bottom:20px">${card('Andamento ore donate','Gennaio – Aprile 2026',`<div class="bar-chart">${monthlyData.map(d=>`<div class="bar-wrap"><div class="bar" style="--h:${d.ore*3}"></div>${d.m}</div>`).join('')}</div>`)}${card('Distribuzione per area','',`<div style="padding:18px 22px">${areaData.map(d=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span class="small">${d.name}</span><b class="small">${d.value}%</b></div><div class="progress"><span style="--w:${d.value}%;--c:${d.color}"></span></div></div>`).join('')}</div>`)}</div>${card('Riepilogo per ETS','Ore donate e valore generato per ogni ente beneficiario',table(['ETS','Città','Progetti','Ore validate','Valore €','Donor coinvolti'],ETSList.filter(e=>e.projects>0).map(e=>row([`<b>${esc(e.name)}</b>`,e.city,e.projects,`<b style="color:var(--orange)">${e.projects*12} h</b>`,`<b>€${e.projects*960}</b>`,e.projects+1])).join('')) )}`;}
    function compliance(){const areas=[...new Set(ComplianceChecks.map(c=>c.area))]; const stats={OK:ComplianceChecks.filter(c=>c.status==='OK').length,Attenzione:ComplianceChecks.filter(c=>c.status==='Attenzione').length,'In lavorazione':ComplianceChecks.filter(c=>c.status==='In lavorazione').length}; return page('Compliance','Monitoraggio obblighi normativi — D.Lgs. 231, GDPR, CTS, Rating Legalità')+`<div class="grid grid-3" style="margin-bottom:22px">${kpi(stats.OK,'OK','✅',C.green)}${kpi(stats.Attenzione,'Attenzione','⚠️',C.amber)}${kpi(stats['In lavorazione'],'In lavorazione','🔄',C.blue)}</div><div class="grid">${areas.map(a=>card(a,'',table(['Voce','Stato','Note'],ComplianceChecks.filter(c=>c.area===a).map(c=>row([`<b>${esc(c.item)}</b>`,badge(c.status),`<span class="muted">${esc(c.note)}</span>`])).join('')))).join('')}</div>`;}
    function tabelle(){const names={skillCategories:'Skill',modalita:'Modalità',statusProgetto:'Stati progetto',statusOre:'Stati ore',areeGeografiche:'Aree geografiche'}; return page('Tabelle base','Anagrafiche di riferimento e lookup tables')+tabs(Object.keys(names),state.tab,'tab',names)+card(names[state.tab],`${TabelleBase[state.tab].length} voci`,`<div style="padding:16px 22px;display:flex;flex-wrap:wrap;gap:10px">${TabelleBase[state.tab].map(v=>`<span class="pill" style="border-radius:12px;padding:10px 16px">${esc(v)} <button class="btn" style="padding:0;border:0" data-action="Modifica voce pronta">✎</button><button class="btn danger" style="padding:0;border:0" data-action="Elimina voce pronta">🗑</button></span>`).join('')}</div>`,btn('＋ Aggiungi','primary','data-action="Aggiunta voce pronta"'));}
    function tabs(items,current,key,labels={}){return `<div class="tabs">${items.map(s=>`<button class="${current===s?'active':''}" data-${key}="${esc(s)}">${esc(labels[s]||s)}</button>`).join('')}</div>`;}
    const views=[dashboard,etsView,aziende,donors,progetti,matching,ore,report,compliance,tabelle];
    document.addEventListener('click',e=>{const t=e.target.closest('[data-ets],[data-donor],[data-project],[data-filter],[data-tab],[data-match-project],[data-start-match],[data-validate],[data-reject]'); if(!t)return; if(t.dataset.ets){state.selected=+t.dataset.ets;render();} if(t.dataset.donor){state.selected=+t.dataset.donor;render();} if(t.dataset.project){state.selected=+t.dataset.project;render();} if(t.dataset.filter){state.filter=t.dataset.filter;render();} if(t.dataset.tab){state.tab=t.dataset.tab;render();} if(t.dataset.matchProject){state.matchingProject=+t.dataset.matchProject;state.matchStarted=false;render();} if(t.dataset.startMatch!==undefined){state.matchStarted=true;render();} if(t.dataset.validate){OreList=OreList.map(o=>o.id==t.dataset.validate?{...o,status:'Validata'}:o);toast('Ora validata');render();} if(t.dataset.reject){OreList=OreList.map(o=>o.id==t.dataset.reject?{...o,status:'Rifiutata'}:o);toast('Ora rifiutata');render();}});
    function toast(msg){const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(window.__toast); window.__toast=setTimeout(()=>el.classList.remove('show'),1800);}
    render();
  </script>
</body>
